<main>
    <h1>{{title}}</h1>
    <p> Open Tickets: {{openTickets() }}</p>
    <p> Resolved Tickets: {{resolvedTickets()}}</p>
    @if(hasOpenTickets()) {
    <p> You have tickets that need attention.</p>
    } @else {
    <p>All Clear!</p>
    }

    <p>Today's Workload : <span class="text-amber-600">{{workloadStatus()}}</span></p>

    <div class="flex gap-16">
        <button (click)="resolveTicket()" class="bg-emerald-100 rounded-sm">Resolve Ticket</button>
        <button (click)="addTicket()" class="bg-cyan-500 rounded-sm"> Add Ticket</button>
    </div>

    @for (ticket of tickets(); track ticket.id) {
    <app-ticket [content]="ticket"></app-ticket>
    } @empty {
    <h2>No open tickets 🎉</h2>
    }
</main>
